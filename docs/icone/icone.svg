<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fonte original do ícone do PlanNote. O "P" é o contorno da letra em Space Grotesk Bold, então o SVG não depende de fonte instalada. A versão final é build/icon.png (1024x1024), de onde o electron-builder gera o .icns e o .ico. -->
  <defs>
    <linearGradient id="a2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="a2-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a66e2"/>
      <stop offset="1" stop-color="#2240b6"/>
    </linearGradient>
    <filter id="a2-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1440" flood-opacity="0.30"/>
    </filter>
    <filter id="a2-ish" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#a2-bg)" filter="url(#a2-ish)"/>
  <g filter="url(#a2-sh)">
    <!-- folhas aparecendo na lateral -->
    <rect x="290" y="196" width="470" height="636" rx="30" fill="#ffffff"/>
    <rect x="264" y="182" width="474" height="660" rx="34" fill="url(#a2-cover)"/>
  </g>
  <!-- lombada -->
  <path d="M298 182 h56 v660 h-56 a34 34 0 0 1 -34 -34 v-592 a34 34 0 0 1 34 -34z" fill="#1a3192"/>
  <!-- elástico -->
  <rect x="664" y="182" width="26" height="660" fill="#14182a" opacity="0.85"/>
  <path transform="translate(427.46 605) scale(0.270000 -0.270000)" fill="#ffd84d" d="M66 0V700H354Q420 700 470.5 673.5Q521 647 549.5 599.0Q578 551 578 485V471Q578 406 548.5 357.5Q519 309 468.5 282.5Q418 256 354 256H198V0ZM198 376H341Q388 376 417.0 402.0Q446 428 446 473V483Q446 528 417.0 554.0Q388 580 341 580H198Z"/>
</svg>
